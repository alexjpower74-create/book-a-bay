<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1c">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Your booking | Book a Bay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/status.js"></script>
</head>
<body>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="dots" aria-hidden="true"></div>

  <header class="bar glass">
    <h1><a class="home mark" href="/">Book a Bay</a></h1>

  <main class="page">

      <p class="eyebrow">Your booking at</p>

    <div id="status" aria-live="polite"></div>
  </main>
