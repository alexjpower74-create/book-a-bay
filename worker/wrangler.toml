name = "book-a-bay"
main = "src/index.js"
compatibility_date = "2026-09-01"

# One Worker serves the API (/api/*, Worker first) and the static app from ../app/public.
[assets]
directory = "../app/public"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "book-a-bay"
# Live database, created 2026-09-15 (docs/DEPLOY.md). Local dev still uses --local.
database_id = "3648979d-4957-4b0c-b9e3-7dee87cfb2b7"
migrations_dir = "migrations"

# No TEST_MODE here, ever. Tests pass it on the command line: --var TEST_MODE:1
