name = "book-a-bay"
main = "src/index.js"
compatibility_date = "2026-09-01"

# One Worker serves the API (/api/*, Worker first) and the static app from ../app/public.
[assets]
directory = "../app/public"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "book-a-bay"
# Placeholder for local dev. A real deploy replaces this with the id from `wrangler d1 create` (see docs/DEPLOY.md).
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# No TEST_MODE here, ever. Tests pass it on the command line: --var TEST_MODE:1
